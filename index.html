<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Levantamiento de bibliotecas 2026 · Duoc UC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#1E2A3A; --ink-2:#2C3B50; --paper:#F4F5F7; --surface:#FFFFFF;
  --rule:#D9DDE3; --muted:#5B6675; --duoc:#F2B705; --duoc-soft:#FDF3CF;
  --ok:#2F8F6B; --mid:#E2A33A; --bad:#C2483A; --none:#D3D7DD;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --display:"Archivo", "Public Sans", system-ui, Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--duoc);outline-offset:2px}

header.top{background:var(--ink);color:#fff;padding:20px 28px 18px;border-bottom:6px solid var(--duoc)}
header.top h1{font-size:1.55rem;font-weight:800;letter-spacing:-.01em}
header.top p{margin:4px 0 0;color:#C6CEDA;font-size:.9rem}

.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 90px)}
aside{background:var(--surface);border-right:1px solid var(--rule);padding:18px 12px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
aside h2{font-size:.95rem;font-weight:700;padding:0 10px 8px;color:var(--muted)}
.sede-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:.92rem}
.sede-btn:hover{background:var(--paper)}
.sede-btn[aria-pressed="true"]{background:var(--ink);color:#fff}
.sede-btn.red{font-weight:700;margin-bottom:6px;border-bottom:1px solid var(--rule);border-radius:6px 6px 0 0}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.dot.on{background:var(--duoc);border-color:var(--duoc)}
.legend-dot{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted);padding:10px 10px 0}

main{padding:22px 28px 60px;min-width:0}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--rule);margin-bottom:22px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 16px;font-family:var(--display);font-weight:600;font-size:.98rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--duoc)}

.scope{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.scope h2{font-size:1.9rem;font-weight:800;letter-spacing:-.015em}
.scope span{color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:6px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.1}
.kpi small{color:var(--muted);font-size:.84rem}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:18px 18px 16px;margin-bottom:20px;min-width:0}
.panel h3{font-size:1.08rem;font-weight:700;margin-bottom:4px}
.panel .note{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.chart-box{position:relative;height:320px}
.chart-box.tall{height:520px}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-family:var(--display);font-weight:600;font-size:.82rem;color:var(--muted);background:var(--paper)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sel td{background:var(--duoc-soft);font-weight:600}

table.matrix th.rot{writing-mode:vertical-rl;transform:rotate(180deg);height:130px;white-space:nowrap;text-align:left;vertical-align:bottom;padding:8px 4px}
table.matrix td.c{text-align:center;font-size:.78rem;font-weight:600;padding:6px 3px;min-width:58px;border:2px solid var(--surface)}
.s-ok{background:var(--ok);color:#fff}.s-mid{background:var(--mid);color:var(--ink)}.s-bad{background:var(--bad);color:#fff}
.s-none{background:var(--none);color:var(--muted)}.s-empty{background:var(--paper);color:#9AA3AF}
.s-pot1{background:#CFE8DD;color:var(--ink)}.s-pot2{background:#F6E2B8;color:var(--ink)}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted);margin-top:10px}
.keys i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.dist{display:grid;grid-template-columns:minmax(120px,max-content) 1fr 34px;gap:6px 10px;align-items:center;font-size:.88rem}
.dist .bar{height:10px;background:var(--paper);border-radius:5px;overflow:hidden}
.dist .bar i{display:block;height:100%;background:var(--ink-2)}
.dist .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

.voice{border-left:4px solid var(--duoc);padding:4px 0 4px 16px;margin-bottom:26px}
.voice h3{font-size:1.15rem;margin-bottom:8px}
.voice dl{margin:0;display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 18px}
.voice dt{color:var(--muted);font-size:.86rem}
.voice dd{margin:0;max-width:72ch}

.msg{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--mid);padding:14px 18px;border-radius:6px;margin-bottom:18px}
.msg.err{border-left-color:var(--bad)}
.empty{color:var(--muted);font-style:italic}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);display:flex;gap:4px;overflow-x:auto;padding:10px}
  aside h2,.legend-dot{display:none}
  .sede-btn{width:auto;white-space:nowrap;flex:none}
  .sede-btn.red{border-bottom:0;margin:0}
  main{padding:16px}
  .grid2{grid-template-columns:1fr}
  .voice dl{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>Levantamiento de bibliotecas 2026</h1>
  <p id="updated">Cargando datos…</p>
</header>

<div class="layout">
  <aside aria-label="Filtro por biblioteca">
    <h2>Biblioteca</h2>
    <div id="sedeList"></div>
    <div class="legend-dot"><span class="dot on"></span> respondió la encuesta</div>
  </aside>

  <main>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div id="messages"></div>
    <section id="view" aria-live="polite"></section>
  </main>
</div>

<script>
/* ================== CONFIGURACIÓN ================== */
const CONFIG = {
  espacios:   "https://docs.google.com/spreadsheets/d/e/2PACX-1vSBEfLu2PoNtVUK_NgqvAVcRw9tRw1-gGvXsinVkZ1CP9jMxoxWv3JBKoNxg1NDb0GHeEgwganpMR2_/pub?gid=1523262154&single=true&output=csv",
  respuestas: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSBEfLu2PoNtVUK_NgqvAVcRw9tRw1-gGvXsinVkZ1CP9jMxoxWv3JBKoNxg1NDb0GHeEgwganpMR2_/pub?gid=1159156740&single=true&output=csv",
  formativas: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7--Sj3QevAiOFmLA4GN68WNoCydtJpKBbrXO1uJIU6gaZQfFbXsuVTDM2Pgp6iA5yVSn6hEzxQnGh/pub?gid=1643968759&single=true&output=csv"
};

const SEDES = ['Alameda','Antonio Varas','Arauco','Concepción','Maipú','Melipilla','Nacimiento',
  'Padre Alonso de Ovalle','Plaza Norte','Plaza Oeste','Plaza Vespucio','Puente Alto','Puerto Montt',
  'San Bernardo','San Carlos','San Joaquín','Valparaíso','Valparaíso (Luis Cousiño)','Viña del Mar','Villarrica'];

const ESPACIOS = [
  ['Zona de Libros','Libros'],['Atención y Orientación','Atención'],['Estudio Individual','Estudio individual'],
  ['Salas de Trabajo Colaborativo','Colaborativo'],['Zona de Competencias','Competencias'],
  ['Realidad Virtual','Realidad virtual'],['Bienestar','Bienestar'],['Comunidad','Comunidad / REC']];
const CONDICIONES = [
  ['Accesibilidad','Accesibilidad'],['Iluminación','Luz natural'],['Climatización','Climatización'],
  ['Conectividad','Wifi'],['Enchufes','Enchufes'],['Zonificación','Acústica'],
  ['Mobiliario','Mobiliario modular'],['Posibilidad de tabiquería','Tabiquería']];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const TABS = [['espacios','Espacios y capacidad'],['infra','Infraestructura'],['formativas','Acciones formativas'],
  ['articulacion','Actividades y articulación'],['necesidades','Necesidades declaradas']];

/* ================== UTILIDADES ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/^biblioteca\s+/,'').replace(/^sede\s+/,'').replace(/\s+/g,' ').trim();
const fmt = (n, d=0) => n == null || isNaN(n) ? '–' : n.toLocaleString('es-CL',{maximumFractionDigits:d, minimumFractionDigits:d});

function num(v){
  if (v == null) return null;
  let s = String(v).trim().replace(/\s/g,'');
  if (!s) return null;
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g,'').replace(',','.');
  else if (s.includes(',')) s = s.replace(',','.');
  const x = parseFloat(s);
  return isNaN(x) ? null : x;
}
function canonSede(raw){
  const n = norm(raw);
  if (!n) return null;
  if (n.includes('cousi')) return 'Valparaíso (Luis Cousiño)';
  if (n.includes('alonso') || n.includes('ovalle')) return 'Padre Alonso de Ovalle';
  if (n.startsWith('san carlos')) return 'San Carlos';
  if (n.includes('vina')) return 'Viña del Mar';
  const exact = SEDES.find(s => norm(s) === n);
  if (exact) return exact;
  const near = SEDES.find(s => n.startsWith(norm(s)) || norm(s).startsWith(n));
  return near || String(raw).trim();
}
const findCol = (headers, prefix) => headers.find(h => h.startsWith(prefix + ' ')) || null;
const findByName = (headers, ...names) => {
  for (const nm of names){ const h = headers.find(x => norm(x) === norm(nm)); if (h) return h; }
  for (const nm of names){ const h = headers.find(x => norm(x).includes(norm(nm))); if (h) return h; }
  return null;
};
function gridCols(headers, prefix){
  return headers.filter(h => h.startsWith(prefix + ' ') && h.includes('['))
    .map(h => ({h, row: h.slice(h.lastIndexOf('[')+1, h.lastIndexOf(']')).trim()}));
}
const short = (row, list) => (list.find(([k]) => norm(row).startsWith(norm(k))) || [null,row])[1];
const countBy = (arr, fn) => arr.reduce((m,x) => { const k = fn(x); if (k != null && k !== '') m.set(k,(m.get(k)||0)+1); return m; }, new Map());
const sumBy = (arr, keyFn, valFn) => arr.reduce((m,x) => { const k = keyFn(x); if (k) m.set(k,(m.get(k)||0)+(valFn(x)||0)); return m; }, new Map());
const multiHas = (value, option) => String(value || '').includes(option);

/* ================== ESTADO ================== */
const S = { espacios:[], resp:[], respHeaders:[], form:[], formCols:{}, sede:null, tab:'espacios', charts:{} };

function loadCSV(url){
  // Se arma la tabla a mano: el modo header de PapaParse rompe los encabezados con comas cuando hay nombres repetidos.
  return new Promise((res, rej) => Papa.parse(url, {
    download:true, header:false, skipEmptyLines:'greedy',
    complete:r => {
      const [head = [], ...rows] = r.data;
      const seen = {};
      const fields = head.map(h => { const k = String(h).trim(); seen[k] = (seen[k] || 0) + 1; return seen[k] > 1 ? `${k} #${seen[k]}` : k; });
      res({ meta:{fields}, data: rows.map(row => Object.fromEntries(fields.map((f,i) => [f, row[i] ?? '']))) });
    },
    error:e => rej(e)
  }));
}

async function init(){
  buildTabs();
  const results = await Promise.allSettled([loadCSV(CONFIG.espacios), loadCSV(CONFIG.respuestas), loadCSV(CONFIG.formativas)]);
  const names = ['Espacios','Respuestas_publico','Resumen_publico (acciones formativas)'];
  const msgs = [];
  results.forEach((r,i) => { if (r.status !== 'fulfilled') msgs.push(`No se pudo leer <b>${names[i]}</b>. Revisa que la pestaña siga publicada como CSV y que el enlace en CONFIG sea el correcto.`); });
  $('#messages').innerHTML = msgs.map(m => `<div class="msg err">${m}</div>`).join('');

  if (results[0].status === 'fulfilled'){
    S.espacios = results[0].value.data.map(r => {
      const h = Object.keys(r);
      const g = (...n) => r[findByName(h, ...n)];
      return {
        sede: canonSede(g('Sede')),
        estanteria: num(g('Estanteria_ml','Estantería')),
        atencion: num(g('Puntos_atencion','Puntos de atención')),
        habitaculos: num(g('Habitaculos_individuales','Habitáculos')),
        salas: num(g('N_salas','salas')),
        capacidad: num(g('Capacidad_aforo','capacidad')),
        m2: num(g('m2_totales','m²')),
        obs: g('Observaciones') || ''
      };
    }).filter(r => r.sede);
  }
  if (results[1].status === 'fulfilled'){
    const h = results[1].value.meta.fields || [];
    S.respHeaders = h;
    const sedeCol = h.find(x => norm(x) === 'sede');
    const latest = new Map();
    results[1].value.data.forEach(r => { const s = canonSede(r[sedeCol]); if (s) latest.set(s, {...r, __sede:s}); });
    S.resp = [...latest.values()];
  }
  if (results[2].status === 'fulfilled'){
    const h = results[2].value.meta.fields || [];
    const c = {
      sede: findByName(h,'Nombre sede envío','Nombre sede'),
      fecha: findByName(h,'Fecha de ejecución','Fecha'),
      accion: findByName(h,'Nombre oficial acc. Formativa','Nombre oficial'),
      mes: findByName(h,'Mes'),
      formato: findByName(h,'Formato'),
      actividad: h.find(x => norm(x) === 'actividad') || findByName(h,'Actividad'),
      escuela: h.find(x => norm(x) === 'escuela') || findByName(h,'Escuela'),
      tipo: findByName(h,'Tipo de Usuario'),
      ia: findByName(h,'Taller IA?','Taller IA'),
      part: findByName(h,'Participaciones','count')
    };
    S.formCols = c;
    S.form = results[2].value.data.map(r => ({
      sede: canonSede(r[c.sede]), fecha: r[c.fecha], accion: r[c.accion], mes: norm(r[c.mes]),
      formato: r[c.formato], actividad: r[c.actividad], escuela: r[c.escuela], tipo: r[c.tipo],
      ia: norm(r[c.ia]).startsWith('s'), part: num(r[c.part]) || 0
    })).filter(r => r.sede);
  }
  $('#updated').textContent = `${S.resp.length} de ${SEDES.length} bibliotecas han respondido la encuesta. Datos en vivo desde Google Sheets (consultados el ${new Date().toLocaleString('es-CL',{dateStyle:'long',timeStyle:'short'})}).`;
  buildSedes();
  render();
}

function buildTabs(){
  $('#tabs').innerHTML = TABS.map(([k,l]) => `<button role="tab" data-tab="${k}" aria-selected="${k===S.tab}">${l}</button>`).join('');
  $('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab;
    document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b)); render(); };
}
function buildSedes(){
  const answered = new Set(S.resp.map(r => r.__sede));
  $('#sedeList').innerHTML = `<button class="sede-btn red" data-sede="" aria-pressed="${!S.sede}">Toda la red</button>` +
    SEDES.map(s => `<button class="sede-btn" data-sede="${esc(s)}" aria-pressed="${S.sede===s}">${esc(s)}<span class="dot ${answered.has(s)?'on':''}" title="${answered.has(s)?'Respondió':'Sin respuesta'}"></span></button>`).join('');
  $('#sedeList').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.sede = b.dataset.sede || null;
    document.querySelectorAll('.sede-btn').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
}

/* ================== RENDER ================== */
function chart(id, cfg){
  if (S.charts[id]) S.charts[id].destroy();
  const el = document.getElementById(id); if (!el) return;
  S.charts[id] = new Chart(el, cfg);
}
Chart.defaults.font.family = '"Public Sans", system-ui, sans-serif';
Chart.defaults.color = '#5B6675';
Chart.defaults.locale = 'es-CL';
Chart.defaults.plugins.legend.labels.boxWidth = 12;

const INK = '#2C3B50', DUOC = '#F2B705', GREY = '#C3C9D1';
const PALETTE = ['#2C3B50','#F2B705','#2F8F6B','#C2483A','#7A8CA3','#E2A33A','#5E4B8B','#3C8DBC','#A0AEC0','#8B5E3C'];

function scopeTitle(extra=''){
  return `<div class="scope"><h2>${S.sede ? esc(S.sede) : 'Toda la red'}</h2><span>${extra}</span></div>`;
}
function kpis(items){ return `<div class="kpis">${items.map(([v,l]) => `<div class="kpi"><b>${v}</b><small>${l}</small></div>`).join('')}</div>`; }
function dist(entries, opts={}){
  if (!entries.length) return `<p class="empty">Sin datos todavía.</p>`;
  const max = Math.max(...entries.map(e => e[1]), 1);
  return `<div class="dist">${entries.map(([l,v]) => `<span>${esc(l)}</span><span class="bar"><i style="width:${v/max*100}%"></i></span><span class="v">${v}</span>`).join('')}</div>`;
}
function render(){
  Object.values(S.charts).forEach(c => c.destroy()); S.charts = {};
  ({espacios:renderEspacios, infra:renderInfra, formativas:renderFormativas, articulacion:renderArticulacion, necesidades:renderNecesidades}[S.tab])();
}
const respFor = () => S.sede ? S.resp.filter(r => r.__sede === S.sede) : S.resp;
const answerOf = (sede, prefix) => { const r = S.resp.find(x => x.__sede === sede); const c = findCol(S.respHeaders, prefix); return r && c ? r[c] : null; };

/* ---------- 1. Espacios y capacidad ---------- */
function renderEspacios(){
  const rows = S.sede ? S.espacios.filter(r => r.sede === S.sede) : S.espacios;
  const sum = k => rows.reduce((a,r) => a + (r[k]||0), 0);
  const m2 = sum('m2'), cap = sum('capacidad');
  const pcCol = findCol(S.respHeaders,'3.6'), lecCol = findCol(S.respHeaders,'2.1');
  const rr = respFor();
  const pcs = pcCol ? rr.reduce((a,r) => a + (num(r[pcCol])||0), 0) : null;
  const lec = lecCol ? rr.reduce((a,r) => a + (num(r[lecCol])||0), 0) : null;

  $('#view').innerHTML = scopeTitle(S.sede ? '' : `${rows.length} bibliotecas`) +
    kpis([[fmt(m2),'m² totales'],[fmt(cap),'puestos de capacidad'],[fmt(cap? m2/cap : null,1),'m² por estudiante'],
      [fmt(sum('salas')),'salas'],[fmt(sum('habitaculos')),'habitáculos individuales'],[fmt(sum('estanteria')),'metros lineales de estantería'],
      [fmt(sum('atencion')),'puntos de atención'],[rr.length ? fmt(lec) : '–','m² de salas de lectura (encuesta)'],[rr.length ? fmt(pcs) : '–','computadores para usuarios (encuesta)']]) +
    `<div class="grid2">
      <div class="panel"><h3>Capacidad por biblioteca</h3><p class="note">Puestos de estudio disponibles.</p><div class="chart-box tall"><canvas id="cCap"></canvas></div></div>
      <div class="panel"><h3>Holgura: m² por estudiante</h3><p class="note">Superficie total dividida por la capacidad. Más alto significa más espacio por persona.</p><div class="chart-box tall"><canvas id="cHol"></canvas></div></div>
    </div>
    <div class="panel"><h3>Detalle por biblioteca</h3><div class="scroll"><table>
      <thead><tr><th>Biblioteca</th><th class="n">m²</th><th class="n">Capacidad</th><th class="n">m²/est.</th><th class="n">Salas</th><th class="n">Habitáculos</th><th class="n">Estantería (ml)</th><th class="n">Atención</th><th class="n">m² lectura</th><th class="n">PCs</th><th>Observaciones</th></tr></thead>
      <tbody>${S.espacios.map(r => `<tr class="${r.sede===S.sede?'sel':''}"><td>${esc(r.sede)}</td><td class="n">${fmt(r.m2,1)}</td><td class="n">${fmt(r.capacidad)}</td><td class="n">${fmt(r.capacidad? r.m2/r.capacidad:null,1)}</td><td class="n">${fmt(r.salas)}</td><td class="n">${fmt(r.habitaculos)}</td><td class="n">${fmt(r.estanteria)}</td><td class="n">${fmt(r.atencion)}</td><td class="n">${fmt(num(answerOf(r.sede,'2.1')),1)}</td><td class="n">${fmt(num(answerOf(r.sede,'3.6')))}</td><td>${esc(r.obs)}</td></tr>`).join('')}</tbody>
    </table></div></div>`;

  const all = [...S.espacios].sort((a,b) => (b.capacidad||0)-(a.capacidad||0));
  const colors = arr => arr.map(r => !S.sede || r.sede === S.sede ? (S.sede ? DUOC : INK) : GREY);
  chart('cCap',{type:'bar',data:{labels:all.map(r=>r.sede),datasets:[{data:all.map(r=>r.capacidad),backgroundColor:colors(all)}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  const hol = S.espacios.filter(r => r.capacidad && r.m2).map(r => ({...r, h:r.m2/r.capacidad})).sort((a,b)=>b.h-a.h);
  chart('cHol',{type:'bar',data:{labels:hol.map(r=>r.sede),datasets:[{data:hol.map(r=>+r.h.toFixed(2)),backgroundColor:colors(hol)}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}}}});
}

/* ---------- 2. Infraestructura ---------- */
function statusClass(v){
  const n = norm(v);
  if (!n) return 's-empty';
  if (n === 'si' || n === 'bueno') return 's-ok';
  if (n === 'parcial' || n === 'regular') return 's-mid';
  if (n === 'no' || n === 'malo') return 's-bad';
  if (n === 'no existe') return 's-none';
  return 's-empty';
}
function potClass(v){
  const n = norm(v);
  if (n.startsWith('ya existe')) return 's-none';
  if (n.startsWith('si')) return 's-pot1';
  if (n.startsWith('con adecuaciones')) return 's-pot2';
  if (n.startsWith('no')) return 's-bad';
  return 's-empty';
}
function potLabel(v){ const n = norm(v); return n.startsWith('ya existe') ? 'Existe' : n.startsWith('si') ? 'Sí' : n.startsWith('con') ? 'Adecuar' : n.startsWith('no') ? 'No' : ''; }
function matrix(prefix, list, clsFn, labelFn = v => v || ''){
  const cols = gridCols(S.respHeaders, prefix);
  if (!cols.length) return `<p class="empty">Sin respuestas todavía.</p>`;
  const sedes = S.sede ? [S.sede] : SEDES;
  return `<div class="scroll"><table class="matrix"><thead><tr><th>Biblioteca</th>${cols.map(c => `<th class="rot" title="${esc(c.row)}">${esc(short(c.row,list))}</th>`).join('')}</tr></thead><tbody>` +
    sedes.map(s => { const r = S.resp.find(x => x.__sede === s);
      return `<tr><td>${esc(s)}</td>${cols.map(c => { const v = r ? r[c.h] : ''; return `<td class="c ${clsFn(v)}" title="${esc(c.row)}: ${esc(v||'sin respuesta')}">${esc(labelFn(v))}</td>`; }).join('')}</tr>`; }).join('') +
    `</tbody></table></div>`;
}
function optionCounts(prefix, options){
  const c = findCol(S.respHeaders, prefix); if (!c) return [];
  const rr = respFor();
  return options.map(o => [o, rr.filter(r => multiHas(r[c], o)).length]).filter(e => e[1] > 0 || S.sede === null);
}
function singleCounts(prefix){
  const c = findCol(S.respHeaders, prefix); if (!c) return [];
  return [...countBy(respFor(), r => r[c])].sort((a,b) => b[1]-a[1]);
}
function renderInfra(){
  const p1 = findCol(S.respHeaders,'3.7'), p2 = findCol(S.respHeaders,'3.9');
  const prio = new Map();
  respFor().forEach(r => { [[p1,'Primera'],[p2,'Segunda']].forEach(([c,k]) => { if (c && r[c]) { const s = short(r[c],ESPACIOS); const o = prio.get(s)||{Primera:0,Segunda:0}; o[k]++; prio.set(s,o); } }); });
  const prioArr = [...prio].sort((a,b) => (b[1].Primera+b[1].Segunda)-(a[1].Primera+a[1].Segunda));
  const equipo = ['Computadores de escritorio','Notebooks en préstamo','Pantallas interactivas','Proyector','Impresora / escáner','Autopréstamo','Kit de grabación'];

  $('#view').innerHTML = scopeTitle(`${respFor().length} ${respFor().length===1?'respuesta':'respuestas'}`) +
    `<div class="panel"><h3>Estado de los espacios</h3><p class="note">Situación actual de cada espacio en la biblioteca.</p>
      ${matrix('3.1', ESPACIOS, statusClass)}
      <div class="keys"><span><i class="s-ok"></i>Bueno</span><span><i class="s-mid"></i>Regular</span><span><i class="s-bad"></i>Malo</span><span><i class="s-none"></i>No existe</span><span><i class="s-empty"></i>Sin respuesta</span></div></div>
    <div class="panel"><h3>Potencial de habilitación</h3><p class="note">Si cada espacio podría habilitarse en la biblioteca actual.</p>
      ${matrix('3.2', ESPACIOS, potClass, potLabel)}
      <div class="keys"><span><i class="s-pot1"></i>Sí, podría habilitarse</span><span><i class="s-pot2"></i>Con adecuaciones</span><span><i class="s-bad"></i>No es posible</span><span><i class="s-none"></i>Ya existe</span></div></div>
    <div class="panel"><h3>Condiciones del espacio</h3><p class="note">Evaluación de cada condición.</p>${matrix('2.4', CONDICIONES, statusClass)}
      <div class="keys"><span><i class="s-ok"></i>Sí</span><span><i class="s-mid"></i>Parcial</span><span><i class="s-bad"></i>No</span><span><i class="s-empty"></i>Sin respuesta</span></div></div>
    <div class="grid2">
      <div class="panel"><h3>Espacios priorizados por las jefaturas</h3><p class="note">Primera y segunda prioridad para habilitar o mejorar.</p><div class="chart-box"><canvas id="cPrio"></canvas></div></div>
      <div class="panel"><h3>Períodos de mayor ocupación</h3>${dist(optionCounts('2.5',['Mañana','Mediodía','Tarde','Vespertino','Semanas de evaluaciones','Período de titulación']))}</div>
      <div class="panel"><h3>Equipamiento tecnológico disponible</h3>${dist(optionCounts('3.5',equipo))}</div>
      <div class="panel"><h3>Ubicación en la sede</h3>${dist(singleCounts('2.2'))}<h3 style="margin-top:18px">Planos actualizados</h3>${dist(singleCounts('2.3'))}</div>
      <div class="panel"><h3>Reserva de espacios colaborativos</h3>${dist(singleCounts('3.4'))}</div>
    </div>`;

  chart('cPrio',{type:'bar',data:{labels:prioArr.map(e=>e[0]),datasets:[
    {label:'Primera prioridad',data:prioArr.map(e=>e[1].Primera),backgroundColor:INK},
    {label:'Segunda prioridad',data:prioArr.map(e=>e[1].Segunda),backgroundColor:DUOC}]},
    options:{indexAxis:'y',maintainAspectRatio:false,scales:{x:{stacked:true,ticks:{precision:0}},y:{stacked:true}}}});
}

/* ---------- 3. Acciones formativas ---------- */
function renderFormativas(){
  const rows = S.sede ? S.form.filter(r => r.sede === S.sede) : S.form;
  const total = rows.reduce((a,r)=>a+r.part,0);
  const sesiones = new Set(rows.map(r => `${r.sede}|${r.fecha}|${r.accion}`)).size;
  const acciones = new Set(rows.map(r => r.accion).filter(Boolean)).size;
  const ia = rows.filter(r=>r.ia).reduce((a,r)=>a+r.part,0);

  $('#view').innerHTML = scopeTitle('Datos del consolidado de acciones formativas 2026') +
    (S.form.length ? '' : `<div class="msg">No hay datos de acciones formativas. Revisa la publicación de la pestaña Resumen_publico.</div>`) +
    kpis([[fmt(total),'participaciones'],[fmt(sesiones),'sesiones realizadas'],[fmt(acciones),'acciones formativas distintas'],
      [total ? fmt(ia/total*100,0)+'%' : '–','participaciones en talleres de IA']]) +
    `<div class="grid2">
      <div class="panel"><h3>${S.sede ? 'Participaciones por acción formativa' : 'Participaciones por biblioteca'}</h3><div class="chart-box tall"><canvas id="cF1"></canvas></div></div>
      <div class="panel"><h3>Participaciones por mes</h3><div class="chart-box"><canvas id="cF2"></canvas></div>
        <h3 style="margin-top:18px">Por tipo de actividad</h3><div class="chart-box" style="height:220px"><canvas id="cF3"></canvas></div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Formato</h3>${dist([...sumBy(rows,r=>r.formato,r=>r.part)].sort((a,b)=>b[1]-a[1]))}
        <h3 style="margin-top:18px">Tipo de usuario</h3>${dist([...sumBy(rows,r=>r.tipo,r=>r.part)].sort((a,b)=>b[1]-a[1]))}</div>
      <div class="panel"><h3>Escuelas con más participaciones</h3>${dist([...sumBy(rows,r=>r.escuela,r=>r.part)].sort((a,b)=>b[1]-a[1]).slice(0,10))}</div>
    </div>`;

  const by = S.sede ? sumBy(rows, r=>r.accion, r=>r.part) : sumBy(S.form, r=>r.sede, r=>r.part);
  const arr = [...by].sort((a,b)=>b[1]-a[1]).slice(0, S.sede ? 12 : 25);
  chart('cF1',{type:'bar',data:{labels:arr.map(e=>e[0]),datasets:[{data:arr.map(e=>e[1]),backgroundColor:INK}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  const bm = sumBy(rows, r=>r.mes, r=>r.part);
  const meses = MESES.filter(m => bm.has(m));
  chart('cF2',{type:'bar',data:{labels:meses.map(m=>m[0].toUpperCase()+m.slice(1)),datasets:[{data:meses.map(m=>bm.get(m)),backgroundColor:DUOC}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  const ba = [...sumBy(rows, r=>r.actividad, r=>r.part)].sort((a,b)=>b[1]-a[1]);
  chart('cF3',{type:'doughnut',data:{labels:ba.map(e=>e[0]),datasets:[{data:ba.map(e=>e[1]),backgroundColor:PALETTE}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:'right'}}}});
}

/* ---------- 4. Actividades y articulación ---------- */
function renderArticulacion(){
  const rr = respFor();
  const freqCols = gridCols(S.respHeaders,'4.1'), orgCols = gridCols(S.respHeaders,'4.2');
  const FREQ = ['1–2','3–5','6–10','Más de 10'];
  const tipoCols = gridCols(S.respHeaders,'5.1'), uFreq = gridCols(S.respHeaders,'5.2'), uForm = gridCols(S.respHeaders,'5.3');

  const actRows = freqCols.map(c => {
    const org = orgCols.find(o => o.row === c.row);
    const hacen = rr.filter(r => r[c.h] && norm(r[c.h]) !== 'no se realiza');
    const orgCount = k => org ? rr.filter(r => norm(r[org.h]) === norm(k)).length : 0;
    return { act:c.row, n:hacen.length, freq:FREQ.map(f => rr.filter(r => r[c.h] === f).length),
      bib:orgCount('Biblioteca'), otra:orgCount('Otra unidad'), conj:orgCount('Conjunta'), single: S.sede && rr[0] ? [rr[0][c.h], org ? rr[0][org.h] : ''] : null };
  });
  const uniRows = tipoCols.map(c => {
    const f = uFreq.find(x => x.row === c.row), fo = uForm.find(x => x.row === c.row);
    const inter = rr.filter(r => r[c.h] && !multiHas(r[c.h],'No interactúa'));
    const top = f ? [...countBy(inter, r => r[f.h])].filter(e => norm(e[0]) !== 'no aplica').sort((a,b)=>b[1]-a[1])[0] : null;
    return { u:c.row, n:inter.length, conj:rr.filter(r => multiHas(r[c.h],'Actividad conjunta')).length,
      formal: fo ? rr.filter(r => r[fo.h] === 'Formal').length : 0, freq: top ? top[0] : '–',
      single: S.sede && rr[0] ? [rr[0][c.h], f ? rr[0][f.h] : '', fo ? rr[0][fo.h] : ''] : null };
  }).sort((a,b) => b.n - a.n);

  const colab = [];
  rr.forEach(r => { for (let n = 1; n <= 3; n++){
    const g = p => { const h = S.respHeaders.find(x => x.startsWith(p) && x.includes(`(${n})`)); return h ? r[h] : ''; };
    const nombre = g('Nombre de la actividad'); if (!nombre) continue;
    colab.push({sede:r.__sede, nombre, socios:g('Unidad(es) socia'), espacio:g('Espacio de biblioteca utilizado'), freq:g('Frecuencia'), part:g('Participantes'), eje:g('Eje CIE')});
  }});
  const instCol = findCol(S.respHeaders,'6.3');
  const inst = instCol ? rr.filter(r => r[instCol]).map(r => [r.__sede, r[instCol]]) : [];

  const actTable = S.sede
    ? `<table><thead><tr><th>Actividad</th><th>Frecuencia anual</th><th>Organiza</th></tr></thead><tbody>${actRows.map(a => `<tr><td>${esc(a.act)}</td><td>${esc(a.single?.[0]||'–')}</td><td>${esc(a.single?.[1]||'–')}</td></tr>`).join('')}</tbody></table>`
    : `<table><thead><tr><th>Actividad</th><th class="n">Bibliotecas que la realizan</th><th class="n">Organiza biblioteca</th><th class="n">Otra unidad</th><th class="n">Conjunta</th></tr></thead><tbody>${actRows.sort((a,b)=>b.n-a.n).map(a => `<tr><td>${esc(a.act)}</td><td class="n">${a.n}</td><td class="n">${a.bib}</td><td class="n">${a.otra}</td><td class="n">${a.conj}</td></tr>`).join('')}</tbody></table>`;
  const uniTable = S.sede
    ? `<table><thead><tr><th>Unidad</th><th>Tipo de interacción</th><th>Frecuencia</th><th>Formalización</th></tr></thead><tbody>${uniRows.map(u => `<tr><td>${esc(u.u)}</td><td>${esc(u.single?.[0]||'–')}</td><td>${esc(u.single?.[1]||'–')}</td><td>${esc(u.single?.[2]||'–')}</td></tr>`).join('')}</tbody></table>`
    : `<table><thead><tr><th>Unidad</th><th class="n">Bibliotecas que interactúan</th><th class="n">Con actividad conjunta</th><th class="n">Relación formal</th><th>Frecuencia más común</th></tr></thead><tbody>${uniRows.map(u => `<tr><td>${esc(u.u)}</td><td class="n">${u.n}</td><td class="n">${u.conj}</td><td class="n">${u.formal}</td><td>${esc(u.freq)}</td></tr>`).join('')}</tbody></table>`;

  $('#view').innerHTML = scopeTitle(`${rr.length} ${rr.length===1?'respuesta':'respuestas'}`) +
    (rr.length ? '' : `<div class="msg">Esta biblioteca aún no responde la encuesta.</div>`) +
    `<div class="grid2">
      <div class="panel"><h3>Otras actividades en la biblioteca</h3><p class="note">Sin contar inducciones ni talleres formativos.</p>${S.sede ? '' : '<div class="chart-box"><canvas id="cAct"></canvas></div>'}<div class="scroll" style="margin-top:12px">${actTable}</div></div>
      <div class="panel"><h3>Articulación con unidades de sede</h3><p class="note">Unidades con las que la biblioteca interactúa en sus espacios.</p><div class="scroll">${uniTable}</div></div>
    </div>
    <div class="panel"><h3>Actividades colaborativas registradas</h3>${colab.length ? `<div class="scroll"><table><thead><tr><th>Biblioteca</th><th>Actividad</th><th>Unidad(es) socia(s)</th><th>Espacio</th><th>Frecuencia</th><th class="n">Participantes</th><th>Eje</th></tr></thead><tbody>${colab.map(c => `<tr><td>${esc(c.sede)}</td><td>${esc(c.nombre)}</td><td>${esc(c.socios)}</td><td>${esc(short(c.espacio,ESPACIOS))}</td><td>${esc(c.freq)}</td><td class="n">${esc(c.part)}</td><td>${esc(c.eje)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">No hay actividades colaborativas registradas.</p>'}</div>
    <div class="grid2">
      <div class="panel"><h3>Quién decide el uso de los espacios</h3>${dist(singleCounts('6.1'))}</div>
      <div class="panel"><h3>Instancia de coordinación en la sede</h3>${dist(singleCounts('6.2'))}${inst.length ? `<table style="margin-top:12px"><tbody>${inst.map(([s,v]) => `<tr><td>${esc(s)}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>` : ''}</div>
      <div class="panel"><h3>Medios de difusión</h3>${dist(optionCounts('6.4',['Correo institucional','Redes sociales','Pantallas o afiches en sede','Docentes y Directores de Carrera','Portal de Bibliotecas']))}</div>
    </div>`;

  if (!S.sede){
    const sorted = [...actRows].sort((a,b)=>b.n-a.n);
    const cols = ['#C9D3E0','#7A8CA3','#2C3B50','#F2B705'];
    chart('cAct',{type:'bar',data:{labels:sorted.map(a=>a.act),datasets:FREQ.map((f,i)=>({label:f+' al año',data:sorted.map(a=>a.freq[i]),backgroundColor:cols[i]}))},
      options:{indexAxis:'y',maintainAspectRatio:false,scales:{x:{stacked:true,ticks:{precision:0},title:{display:true,text:'N° de bibliotecas'}},y:{stacked:true}}}});
  }
}

/* ---------- 5. Necesidades declaradas ---------- */
function renderNecesidades(){
  const campos = [
    ['2.6','Demanda no satisfecha y limitaciones'],['2.7','Qué renovar o cambiar'],
    ['3.7','Primera prioridad'],['3.8','Por qué'],['3.9','Segunda prioridad'],['3.10','Por qué'],
    ['3.3','Otro espacio'],['4.3','Otra actividad'],['5.4','Otra unidad'],
    ['6.5','Colaboración que le gustaría iniciar'],['7.1','Comentarios finales']];
  const rr = respFor().sort((a,b) => SEDES.indexOf(a.__sede) - SEDES.indexOf(b.__sede));
  $('#view').innerHTML = scopeTitle('Respuestas abiertas de las jefaturas') +
    (rr.length ? rr.map(r => {
      const items = campos.map(([p,l]) => { const c = findCol(S.respHeaders,p); return c && r[c] ? `<dt>${l}</dt><dd>${esc(r[c])}</dd>` : ''; }).join('');
      return `<article class="voice"><h3>${esc(r.__sede)}</h3>${items ? `<dl>${items}</dl>` : '<p class="empty">Sin respuestas abiertas.</p>'}</article>`;
    }).join('') : `<div class="msg">${S.sede ? 'Esta biblioteca aún no responde la encuesta.' : 'Todavía no hay respuestas.'}</div>`);
}

init().catch(e => { $('#messages').innerHTML = `<div class="msg err">Error al cargar el panel: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
